<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — StudyNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="graduation-cap" class="icon" style="color:#fff;"></i></div>
      <div>
        <div class="brand-name">StudyNest</div>
        <div class="brand-sub">Academic Tracker</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="dashboard.html"><i data-lucide="layout-dashboard" class="icon"></i>Dashboard</a>
      <a class="nav-item" href="tasks.html"><i data-lucide="check-square" class="icon"></i>My Tasks</a>
      <a class="nav-item" href="subjects.html"><i data-lucide="book-open" class="icon"></i>My Subjects</a>
      <a class="nav-item" href="planner.html"><i data-lucide="calendar-days" class="icon"></i>Study Planner</a>
      <a class="nav-item" href="study.html"><i data-lucide="timer" class="icon"></i>Study Timer</a>
      <a class="nav-item active" href="calendar.html"><i data-lucide="calendar" class="icon"></i>Calendar</a>
      <a class="nav-item" href="progress.html"><i data-lucide="bar-chart-2" class="icon"></i>Insights</a>
      <a class="nav-item" href="profile.html"><i data-lucide="user" class="icon"></i>Profile</a>
    </nav>
    <div class="sidebar-footer">
      <a class="nav-item logout" id="logoutBtn"><i data-lucide="log-out" class="icon"></i>Logout</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn"><i data-lucide="menu" class="icon"></i></button>
      <div class="topbar-left">
        <h1 class="welcome">Calendar</h1>
      </div>
    </header>

    <section class="page active">
      <div class="calendar-wrapper">
        <div class="cal-header">
          <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
            <button class="btn btn-ghost" id="prevMonth">←</button>
            <button class="btn btn-ghost" id="curMonth">This Month</button>
            <button class="btn btn-ghost" id="nextMonth">→</button>
            <h3 class="cal-title" id="calTitle">Loading...</h3>
          </div>
        </div>
        <div id="calGridContainer"></div>
      </div>
    </section>
  </div>

  
  <div class="modal-backdrop" id="dayDetailModal">
    <div class="modal" style="max-width: 560px;">
      <div class="modal-head">
        <h3 id="dayDetailTitle">Day Details</h3>
        <button class="icon-btn" data-close="dayDetailModal" type="button">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <div id="dayDetailBody"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="dayDetailModal">Close</button>
      </div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/pages.js"></script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
