<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner — StudyNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="graduation-cap" class="icon" style="color:#fff;"></i></div>
      <div>
        <div class="brand-name">StudyNest</div>
        <div class="brand-sub">Academic Tracker</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="dashboard.html"><i data-lucide="layout-dashboard" class="icon"></i>Dashboard</a>
      <a class="nav-item" href="tasks.html"><i data-lucide="check-square" class="icon"></i>My Tasks</a>
      <a class="nav-item" href="subjects.html"><i data-lucide="book-open" class="icon"></i>My Subjects</a>
      <a class="nav-item active" href="planner.html"><i data-lucide="calendar-days" class="icon"></i>Study Planner</a>
      <a class="nav-item" href="study.html"><i data-lucide="timer" class="icon"></i>Study Timer</a>
      <a class="nav-item" href="calendar.html"><i data-lucide="calendar" class="icon"></i>Calendar</a>
      <a class="nav-item" href="progress.html"><i data-lucide="bar-chart-2" class="icon"></i>Insights</a>
      <a class="nav-item" href="profile.html"><i data-lucide="user" class="icon"></i>Profile</a>
    </nav>
    <div class="sidebar-footer">
      <a class="nav-item logout" id="logoutBtn"><i data-lucide="log-out" class="icon"></i>Logout</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn"><i data-lucide="menu" class="icon"></i></button>
      <div class="topbar-left">
        <h1 class="welcome">Study Planner</h1>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" id="addSessionBtn">
          <i data-lucide="plus" class="icon"></i> Add Session
        </button>
      </div>
    </header>

    <section class="page active">
      <div class="planner-wrapper">
        <div class="planner-header">
          <div class="planner-nav">
            <button class="btn btn-ghost btn-sm" id="prevWeek">← Previous</button>
            <button class="btn btn-ghost btn-sm" id="todayBtn">Today</button>
            <button class="btn btn-ghost btn-sm" id="nextWeek">Next →</button>
          </div>
          <h3 class="planner-title" id="plannerTitle">Loading…</h3>
        </div>
        <div class="planner-days" id="plannerDays"></div>
        <div class="planner-body" id="plannerBody">
          <div class="planner-times" id="plannerTimes"></div>
          <div class="planner-grid" id="plannerGrid"></div>
        </div>
        <div class="planner-state" id="plannerState"></div>
      </div>
    </section>
  </div>

  
  <div class="modal-backdrop" id="sessionFormModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="sessionFormTitle">Schedule a Study Session</h3>
        <button class="icon-btn" data-close="sessionFormModal" type="button"><i data-lucide="x" class="icon"></i></button>
      </div>
      <form id="sessionForm" novalidate>
        <input type="hidden" id="sessionId">
        <div class="field">
          <label for="sfTitle">Activity Title *</label>
          <input type="text" id="sfTitle" placeholder="e.g. Review Chapter 5" required>
          <span id="errTitle" style="color:var(--status-overdue); display:block; font-size:13px; font-weight:600; margin-top:6px; min-height:16px;"></span>
        </div>
        <div class="form-grid" style="margin-bottom:20px;">
          <div class="field">
            <label for="sfSubject">Subject *</label>
            <input list="subjectOptions" id="sfSubject" placeholder="e.g. Mathematics" required>
            <datalist id="subjectOptions"></datalist>
            <span id="errSubject" style="color:var(--status-overdue); display:block; font-size:13px; font-weight:600; margin-top:6px; min-height:16px;"></span>
          </div>
          <div class="field">
            <label for="sfTask">Related Task (Optional)</label>
            <select id="sfTask">
              <option value="">None</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="sfDate">Study Date *</label>
          <input type="date" id="sfDate" required>
          <span id="errDate" style="color:var(--status-overdue); display:block; font-size:13px; font-weight:600; margin-top:6px; min-height:16px;"></span>
        </div>
        <div class="form-grid" style="margin-bottom:20px;">
          <div class="field">
            <label for="sfStart">Start Time *</label>
            <input type="time" id="sfStart" required>
            <span id="errStart" style="color:var(--status-overdue); display:block; font-size:13px; font-weight:600; margin-top:6px; min-height:16px;"></span>
          </div>
          <div class="field">
            <label for="sfEnd">End Time *</label>
            <input type="time" id="sfEnd" required>
            <span id="errEnd" style="color:var(--status-overdue); display:block; font-size:13px; font-weight:600; margin-top:6px; min-height:16px;"></span>
          </div>
        </div>
        <div class="field">
          <label for="sfNotes">Notes (Optional)</label>
          <textarea id="sfNotes" rows="3" placeholder="Review Chapters 1–3..."></textarea>
        </div>
        <div id="errForm" style="color:var(--status-overdue); font-size:13px; font-weight:600; margin-bottom:8px;"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="sessionFormModal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveSessionBtn">Save Session</button>
        </div>
      </form>
    </div>
  </div>

  
  <div class="modal-backdrop" id="sessionDetailModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Session Details</h3>
        <button class="icon-btn" data-close="sessionDetailModal" type="button"><i data-lucide="x" class="icon"></i></button>
      </div>
      <div id="sessionDetailBody"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="sessionDetailModal">Close</button>
        <button class="btn btn-danger" id="detailDeleteBtn"><i data-lucide="trash-2" class="icon"></i> Delete</button>
        <button class="btn btn-primary" id="detailEditBtn"><i data-lucide="edit" class="icon"></i> Edit</button>
      </div>
    </div>
  </div>

  
  <div class="modal-backdrop" id="deleteConfirmModal">
    <div class="modal" style="max-width: 420px;">
      <div class="modal-head">
        <h3 style="color:var(--status-overdue)">Delete Session?</h3>
        <button class="icon-btn" data-close="deleteConfirmModal" type="button"><i data-lucide="x" class="icon"></i></button>
      </div>
      <p style="color:var(--text-muted);font-size:15px;margin:0 0 24px;">This session will be removed. Cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="deleteConfirmModal">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete Session</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><i data-lucide="check-circle" class="icon"></i><span id="toastMsg">Saved</span></div>

  <script src="js/supabase-config.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/pages.js"></script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
