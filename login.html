<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — StudyNest</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    
    <!-- VISUAL SIDE -->
    <div class="auth-visual">
      <div class="visual-top">
        <h1>StudyNest<span>Smart Study Planner</span></h1>
      </div>
      <div class="visual-bottom">
        <h2>Welcome Back!</h2>
        <p>Sign in to keep track of your tasks, plan your week, and stay ahead of every deadline.</p>
      </div>
    </div>

    <!-- FORM SIDE -->
    <div class="auth-form-side">
      <div class="auth-card">
        
        <!-- Centered Logo -->
        <div class="logo-icon">
          <i data-lucide="graduation-cap" style="width:32px;height:32px;"></i>
        </div>
        
        <!-- Centered Text -->
        <h1>Sign In</h1>
        <p class="auth-sub">Welcome back to StudyNest</p>
        
        <div class="auth-error-alert" id="loginError"></div>
        
        <form id="loginForm" novalidate>
          
          <div class="field">
            <label for="loginEmail">Email Address</label>
            <div class="input-wrap">
              <i data-lucide="mail"></i>
              <input type="email" id="loginEmail" placeholder="you@email.com" autocomplete="email" required>
            </div>
            <span class="field-error" id="loginEmailError"></span>
          </div>

          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="input-wrap">
              <i data-lucide="lock"></i>
              <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" onclick="togglePassword('loginPassword', this)">
                <i data-lucide="eye"></i>
              </button>
            </div>
            <span class="field-error" id="loginPasswordError"></span>
          </div>

          <div class="form-options">
            <label class="checkbox-wrap">
              <input type="checkbox" id="rememberMe"> Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>
          
        </form>
        
        <p class="auth-foot">Don't have an account? <a href="register.html">Create one</a></p>
        <a href="index.html" class="btn-home"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Back to home</a>
        
      </div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
