<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — StudyNest</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- MOBILE OVERLAY -->
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <i data-lucide="graduation-cap" class="icon" style="color:#fff;"></i>
      </div>
      <div>
        <div class="brand-name">StudyNest</div>
        <div class="brand-sub">Academic Tracker</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item" href="dashboard.html"><i data-lucide="layout-dashboard" class="icon"></i>Dashboard</a>
      <a class="nav-item" href="tasks.html"><i data-lucide="check-square" class="icon"></i>My Tasks</a>
      <a class="nav-item" href="subjects.html"><i data-lucide="book-open" class="icon"></i>My Subjects</a>
      <a class="nav-item" href="planner.html"><i data-lucide="calendar-days" class="icon"></i>Study Planner</a>
      <a class="nav-item" href="study.html"><i data-lucide="timer" class="icon"></i>Study Timer</a>
      <a class="nav-item" href="calendar.html"><i data-lucide="calendar" class="icon"></i>Calendar</a>
      <a class="nav-item" href="progress.html"><i data-lucide="bar-chart-2" class="icon"></i>Insights</a>
      <a class="nav-item active" href="profile.html"><i data-lucide="user" class="icon"></i>Profile</a>
    </nav>

    <div class="sidebar-footer">
      <a class="nav-item logout" id="logoutBtn"><i data-lucide="log-out" class="icon"></i>Logout</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <header class="topbar">
      <button class="menu-btn" id="menuBtn"><i data-lucide="menu" class="icon"></i></button>
      <div class="topbar-left">
        <h1 class="welcome">My Profile</h1>
      </div>
    </header>

    <section class="page active">

      <!-- PROFILE HEADER CARD -->
      <div class="card">
        <div class="profile-header">
          <div class="profile-avatar-large" id="profileAvatarWrap" title="Click to change avatar">
            <div id="profileAvatar">S</div>
            <div class="profile-avatar-cam">
              <i data-lucide="camera" class="icon" style="width:16px;height:16px;"></i>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;">
          </div>

          <div style="flex:1; min-width:200px;">
            <h2 id="profileName" style="font-family:var(--font-head); margin:0 0 8px; font-size:28px; color:#fff;">
              Loading...
            </h2>
            <p id="profileEmail" style="margin:0 0 12px; color:var(--text-muted); font-size:16px;">
              Loading...
            </p>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <span style="background:rgba(139,92,246,0.15); color:var(--secondary); padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700;">
                Student
              </span>
              <span style="background:rgba(16,185,129,0.15); color:var(--status-completed); padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700;">
                Active
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- EDIT PROFILE CARD -->
      <div class="card">
        <div class="card-head">
          <h3>Account Information</h3>
        </div>

        <form id="profileForm">
          <div class="form-grid" style="margin-bottom:20px;">
            <div class="field">
              <label>Full Name</label>
              <input type="text" id="profileNameInput" required placeholder="Your name">
            </div>
            <div class="field">
              <label>Email (read-only)</label>
              <input type="email" id="profileEmailInput" disabled>
            </div>
          </div>

          <div class="form-grid" style="margin-bottom:20px;">
            <div class="field">
              <label>Weekly Goal (hours)</label>
              <input type="number" id="profileGoalHours" min="1" max="100" step="1" placeholder="8">
            </div>
            <div class="field">
              <label>User ID</label>
              <input type="text" id="profileId" disabled style="font-size:12px;">
            </div>
          </div>

          <div class="modal-actions" style="justify-content: flex-start;">
            <button type="submit" class="btn btn-primary" id="saveProfileBtn">
              <i data-lucide="save" class="icon"></i> Save Changes
            </button>
          </div>
        </form>
      </div>

      <!-- PASSWORD CARD -->
      <div class="card">
        <div class="card-head">
          <h3>Change Password</h3>
        </div>

        <form id="passwordForm">
          <div class="field">
            <label>New Password</label>
            <input type="password" id="newPassword" minlength="6" required placeholder="At least 6 characters" autocomplete="new-password">
          </div>
          <div class="field">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" minlength="6" required placeholder="Re-enter new password" autocomplete="new-password">
          </div>

          <div id="passwordMsg" style="font-size:13px; font-weight:600; margin-bottom:12px;"></div>

          <div class="modal-actions" style="justify-content: flex-start;">
            <button type="submit" class="btn btn-primary" id="changePasswordBtn">
              <i data-lucide="lock" class="icon"></i> Change Password
            </button>
          </div>
        </form>
      </div>

      <!-- DANGER ZONE -->
      <div class="card" style="border-color: rgba(239,68,68,0.3);">
        <div class="card-head">
          <h3 style="color: var(--status-overdue);">Danger Zone</h3>
        </div>

        <p style="color: var(--text-muted); font-size:14px; margin: 0 0 16px;">
          Logging out will end your session. You can log back in anytime.
        </p>

        <button type="button" class="btn btn-danger" id="logoutBtnDanger">
          <i data-lucide="log-out" class="icon"></i> Log Out
        </button>
      </div>

    </section>
  </div>

  <div class="toast" id="toast">
    <i data-lucide="check-circle" class="icon"></i>
    <span id="toastMsg">Saved</span>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/profile.js"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
